version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: meetmaze-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: meetmaze
      MYSQL_USER: meetmaze
      MYSQL_PASSWORD: meetmaze
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'meetmaze', '-pmeetmaze']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
